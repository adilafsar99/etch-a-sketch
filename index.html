<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="styles.css" />
		<script src="scripts.js" defer></script>
		<title>Etch-a-Sketch</title>
	</head>
	<body>
		<main class="main">
			<div class="buttons-and-grid">
				<div class="buttons">
					<input type="color" name="color-picker" id="color-picker" />
					<button id="randomizer">Randomize</button>
					<button id="toggle-button">Show Grid Lines</button>
					<button id="clear-button">Clear Grid</button>
					<div class="slider">
					<span id="grid-size"></span>
					<input type="range" id="slider" min="16" max="64" step="1" />
					<label for="slider">Grid Size</label>
				</div>
				</div>
				<div class="grid-box">
					<div class="header">
						<h1 class="title">Etch-A-Sketch</h1>
					</div>
					<div class="grid"></div>
				</div>
			</div>
		</main>
	</body>
</html>
