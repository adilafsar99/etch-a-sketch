<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles.css">
		<script src="scripts.js" defer></script>
		<title>Etch-a-Sketch</title>
	</head>
	<body>
		<header class="header">
            <h1 class="title">Etch-A-Sketch</h1>
        </header>
		<main class="main">
			<div class="buttons-and-grid">
				<div class="buttons">
					<button id="toggle-button">Toggle Grid Lines</button>
					<button id="clear-button">Clear Grid</button>
					<label for="color-picker"></label>
					<input type="color" name="color-picker" id="color-picker" value="#000">
				</div>
				<div class="grid"></div>
			</div>
            <div class="slider">
                <label for="slider">Adjust the grid squares.</label>
               <input type="range" id="slider" min="16" max="64" step="1" list="markers">
               <datalist id="markers">
                  <option value="16"></option>
                  <option value="32"></option>
                  <option value="48"></option>
                  <option value="64"></option>
               </datalist>
            </div>
		</main>
	</body>
</html>
