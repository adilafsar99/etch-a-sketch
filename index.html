<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="styles.css" />
		<script src="scripts.js" defer></script>
		<title>Etch-a-Sketch</title>
	</head>
	<body>
		<header class="header">
			<h1 class="title">Etch-A-Sketch</h1>
		</header>
		<main class="main">
			<div class="buttons-and-grid">
				<div class="buttons">
					<button id="toggle-button">Toggle Grid Lines</button>
					<button id="clear-button">Clear Grid</button>
					<span class="color-picker">
						<label for="color-picker">Pen Color</label>
						<input
							type="color"
							name="color-picker"
							id="color-picker"
						/>
					</span>
					<button id="randomizer">Randomizer</button>
				</div>
				<div class="grid"></div>
			</div>
			<div class="slider">
				<span id="grid-size"></span>
				<input type="range" id="slider" min="16" max="64" step="1" />
			</div>
		</main>
	</body>
</html>
